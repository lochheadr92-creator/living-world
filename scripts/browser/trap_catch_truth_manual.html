<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staged trap-window verification</title></head><body>
<div id="app"><canvas id="world" aria-label="The simulated world"></canvas><div id="ui"></div></div>
<div style="position:fixed;top:60px;left:10px;width:205px;font-size:12px;z-index:2000;background:#15251c;padding:10px;color:white"><strong>STAGED trap catch report</strong><p>Staged trap and deer. Paid setting/checking; an unrecovered body then decays through its actual lifecycle.</p><button id="cut">Set and check the early catch</button><button id="decay">Leave catch to decay, then check</button><output id="result"></output></div>
<script type="module">
import '/src/styles.css';
import {Game} from '/src/app/game.ts';import {Renderer} from '/src/render/renderer.ts';import {mountUI} from '/src/ui/index.ts';import {project} from '/src/render/iso.ts';
import {stage,addPerson,done,learn} from '/tests/helpers/kit.ts';import {makeSource} from '/src/sim/sources.ts';import {mintTool} from '/src/sim/tools.ts';import {gearTick} from '/src/sim/passive_gear.ts';
import {makeWolf} from '/src/sim/wildlife.ts';import {CURRENT_RULES_VERSION} from '/src/sim/rulesversion.ts';
import {carcassTick,CARCASS_LIFETIME} from '/src/sim/carcass.ts';
import {generateOptions} from '/src/sim/decision.ts';import {startActivity,stepActivity,newActivity} from '/src/sim/activities.ts';
import {serializeWorld,deserializeWorld} from '/src/app/save.ts';import {conservationReport} from '/src/sim/economy.ts';
const s=stage('trap-window'),w=s.w;w.settings={...w.settings,dynamics:'rich',rulesVersion:CURRENT_RULES_VERSION};
const p=addPerson(s,'Ada',40.5,40.5,{hunger:65,thirst:90,energy:90}),fish=makeSource(w,'tree',41,40,5),deer=makeWolf(w,42.5,41.5,'deer'),tool=mintTool(w,'trap',0,p.hhId,p.id,p.inv,p.id,'staged initial gear',false);done(s);learn(w,p,fish,deer);let gear;
const g=new Game(w.settings);g.restoreWorld(w,w.settings);g.setPlaying(false);g.select(p.id);
const pt=project(41,40);g.camera={x:pt.sx+20,y:pt.sy,zoom:2};
const renderer=new Renderer(document.getElementById('world'),g),ui=mountUI(g,document.getElementById('ui')),result=document.getElementById('result');
function finish(){for(let i=0;i<700&&p.activity;i++){w.tick++;stepActivity(w,p);}if(p.activity)throw Error('Activity did not finish');}
function offered(key){const o=generateOptions(w,p,true,true).options.find(o=>o.key===key);if(!o)throw Error('Missing '+key);startActivity(w,p,o.make());finish();}
function check(){w.tick++;gearTick(w);learn(w,p,gear);offered(`gear:check:${gear.id}`);}
function verify(){const before=serializeWorld(w);ui.update(1);result.textContent=` Live deer: ${w.animals.filter(a=>a.type==='deer').length}; bodies: ${w.piles.filter(b=>b.carcass).length}; original window remaining: ${Math.max(0,(gear?.gear.readyAt??w.tick)-w.tick)}; state: ${gear?.gear.state??'carried'}; result: ${p.lastResult?.detail??'no work yet'}; conservation: ${conservationReport(w).ok}; pure: ${before===serializeWorld(w)}; exact save: ${before===serializeWorld(deserializeWorld(before))}`;}
document.getElementById('cut').onclick=()=>{offered(`gear:place:${tool.id}:${fish.id}`);gear=w.piles.find(b=>b.gear);check();g.select(gear.id);verify();};
document.getElementById('decay').onclick=()=>{const body=w.byId.get(gear.gear.bodyId);w.tick=body.since+CARCASS_LIFETIME;carcassTick(w);learn(w,p,gear);startActivity(w,p,newActivity(w,p,{kind:'gear_work',label:'Check neglected trap',goal:'look for food',here:true,targetId:gear.id,targetType:'pile',data:{op:'check'}}));finish();g.select(gear.id);verify();result.textContent+=' Check report: '+p.log.at(-1).text;};
function frame(){renderer.frame(.016);ui.update(.016);requestAnimationFrame(frame);}frame();verify();
</script></body></html>
