<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staged private-cellar verification</title></head><body>
<div id="app"><canvas id="world" aria-label="The simulated world"></canvas><div id="ui"></div></div>
<div style="position:fixed;top:60px;left:10px;width:215px;font-size:12px;z-index:2000;background:#15251c;padding:10px;color:white"><strong>STAGED private cellar</strong><p>Paid construction. Initial carried berries are declared. Deposit and meal use real actions; the meal button stages hunger.</p><button id="store">Store carried surplus</button><button id="eat">Eat from cellar</button><output id="result"></output></div>
<script type="module">
import '/src/styles.css';import {Game} from '/src/app/game.ts';import {Renderer} from '/src/render/renderer.ts';import {mountUI} from '/src/ui/index.ts';import {project} from '/src/render/iso.ts';
import {stage,addPerson,site,done,learn} from '/tests/helpers/kit.ts';import {newActivity,startActivity,stepActivity} from '/src/sim/activities.ts';import {generateOptions} from '/src/sim/decision.ts';import {serializeWorld,deserializeWorld} from '/src/app/save.ts';import {conservationReport} from '/src/sim/economy.ts';
const s=stage('visible-cellar'),w=s.w;w.settings={...w.settings,dynamics:'rich',rulesVersion:135};const p=addPerson(s,'Ada',40.5,24.5,{hunger:95,thirst:95,energy:95,inv:{berries:8}});const st=site(s,'cellar',40,23,p.hhId,p.id,{wood:6,stone:9});done(s);
function finish(){for(let i=0;i<1500&&p.activity;i++){w.tick++;stepActivity(w,p);}if(p.activity)throw Error('Unfinished action');}
startActivity(w,p,newActivity(w,p,{kind:'build',label:'Build cellar',goal:'staged paid construction',targetId:st.id,targetType:'site',tx:41,ty:23.5,spotX:40.5,spotY:24.5,maxTicks:1500}));finish();const b=w.buildings.find(b=>b.type==='cellar');
const g=new Game(w.settings);g.restoreWorld(w,w.settings);g.setPlaying(false);g.select(b.id);const pt=project(41,23.5);g.camera={x:pt.sx+20,y:pt.sy,zoom:2.5};const renderer=new Renderer(document.getElementById('world'),g),ui=mountUI(g,document.getElementById('ui')),result=document.getElementById('result');
function verify(){const raw=serializeWorld(w);ui.update(1);result.textContent=` Materials used: ${JSON.stringify(st.used)}. Cellar berries: ${b.store.items.berries??0}; carried: ${p.inv.berries??0}; hunger: ${p.needs.hunger}; conserved: ${conservationReport(w).ok}; observer pure: ${raw===serializeWorld(w)}; exact save: ${raw===serializeWorld(deserializeWorld(raw))}`;}
function chosen(kind){learn(w,p,b);const o=generateOptions(w,p,true,true).options.find(o=>o.kind===kind&&o.targetId===b.id);if(!o)throw Error('No '+kind+' offer');startActivity(w,p,o.make());finish();verify();}
document.getElementById('store').onclick=()=>chosen('deposit');document.getElementById('eat').onclick=()=>{p.needs.hunger=10;chosen('eat_store');};function frame(){renderer.frame(.016);ui.update(.016);requestAnimationFrame(frame);}frame();verify();
</script></body></html>
