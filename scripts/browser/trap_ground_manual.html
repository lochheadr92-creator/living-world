<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staged trap-ground verification</title></head><body>
<div id="app"><canvas id="world" aria-label="The simulated world"></canvas><div id="ui"></div></div>
<div style="position:fixed;top:70px;left:10px;width:205px;font-size:11px;line-height:1.2;z-index:2000;background:#15251c;padding:10px;color:white"><strong>STAGED trap-ground contract</strong><p>One staged deer, trap and two trees. Real perception, work, catch, butchery and meal.</p><button id="unknown">Check without a sighting</button><button id="moving">Keep the chosen ground</button><button id="catch">Observe, set, check and eat</button><output id="result"></output></div>
<script type="module">
import '/src/styles.css';
import {Game} from '/src/app/game.ts';import {Renderer} from '/src/render/renderer.ts';import {mountUI} from '/src/ui/index.ts';import {project} from '/src/render/iso.ts';
import {stage,addPerson,done,learn} from '/tests/helpers/kit.ts';import {makeSource} from '/src/sim/sources.ts';import {mintTool} from '/src/sim/tools.ts';import {gearTick} from '/src/sim/passive_gear.ts';import {makeWolf} from '/src/sim/wildlife.ts';import {perceive} from '/src/sim/perception.ts';import {rebuildMobileGrid} from '/src/sim/registry.ts';
import {generateOptions,reviewActivity} from '/src/sim/decision.ts';import {startActivity,stepActivity} from '/src/sim/activities.ts';
import {serializeWorld,deserializeWorld} from '/src/app/save.ts';import {conservationReport} from '/src/sim/economy.ts';
const s=stage('trap-ground'),w=s.w;w.settings={...w.settings,dynamics:'rich',rulesVersion:128};
const p=addPerson(s,'Ada',40.5,40.5,{inv:{},hunger:40,thirst:90,energy:90}),near=makeSource(w,'tree',41,40,5),ground=makeSource(w,'tree',46,40,5),tool=mintTool(w,'trap',0,p.hhId,p.id,p.inv,p.id,'staged fixture',false);done(s);learn(w,p,near,ground);const deer=makeWolf(w,46.5,41.5,'deer');rebuildMobileGrid(w);
const g=new Game(w.settings);g.restoreWorld(w,w.settings);g.setPlaying(false);g.select(p.id);const pt=project(46,41);g.camera={x:pt.sx+80,y:pt.sy,zoom:2};
const renderer=new Renderer(document.getElementById('world'),g),ui=mountUI(g,document.getElementById('ui')),result=document.getElementById('result');
function finish(){for(let n=0;n<1000&&p.activity;n++){w.tick++;stepActivity(w,p);}if(p.activity)throw Error('unfinished action');}
function offered(key){const o=generateOptions(w,p,true,true).options.find(o=>o.key===key);if(!o)throw Error('Missing '+key);startActivity(w,p,o.make());finish();}
function verify(text){const before=serializeWorld(w);ui.update(1);generateOptions(w,p,true,true);result.textContent=text+`; conservation: ${conservationReport(w).ok}; pure: ${before===serializeWorld(w)}; exact save: ${before===serializeWorld(deserializeWorld(before))}`;}
document.getElementById('unknown').onclick=()=>{const offer=generateOptions(w,p,true,true).options.find(o=>o.kind==='gear_work');verify(`Without a sighting: ${offer?'unexpected trap offer':'no trap site offered'}`);};
document.getElementById('moving').onclick=()=>{p.needs.hunger=70;perceive(w,p);const o=generateOptions(w,p,true,true).options.find(o=>o.key.startsWith('gear:place'));const a=o.make();a.data.optKey=o.key;startActivity(w,p,a);deer.x=40.5;deer.y=40.5;w.tick+=30;rebuildMobileGrid(w);perceive(w,p);reviewActivity(w,p);if(p.activity?.id!==a.id)throw Error('Selected trap journey was lost');finish();const gear=w.piles.find(b=>b.gear);g.select(gear.id);verify(`New sighting: nearer tree ${near.id}; kept selected ground: ${gear.gear.sourceId}; original ground: ${ground.id}; placement completed`);};
document.getElementById('catch').onclick=()=>{perceive(w,p);const o=generateOptions(w,p,true,true).options.find(o=>o.kind==='gear_work'&&o.key.startsWith('gear:place'));if(!o||o.targetId!==ground.id)throw Error('Did not choose witnessed ground');const reason=o.goal;startActivity(w,p,o.make());finish();const gear=w.piles.find(b=>b.gear);for(let n=0;n<10&&!w.piles.some(b=>b.carcass);n++){w.tick=gear.gear.readyAt;gearTick(w);learn(w,p,gear);offered(`gear:check:${gear.id}`);if(!w.piles.some(b=>b.carcass))offered(`gear:reset:${gear.id}`);}const body=w.piles.find(b=>b.carcass);if(!body)throw Error('No body after ten paid attempts');rebuildMobileGrid(w);perceive(w,p);offered(`butcher:${body.id}:meat`);const eat=generateOptions(w,p,true,true).options.find(o=>o.kind==='eat');if(!eat)throw Error('No eating option');startActivity(w,p,eat.make());finish();g.select(body.id);verify(`Chosen ground: ${ground.id}; nearer tree: ${near.id}; ${reason}; live deer: ${w.animals.length}; meat eaten: ${w.ledger.consumed.meat??0}`);};
function frame(){renderer.frame(.016);ui.update(.016);requestAnimationFrame(frame);}frame();
</script></body></html>
