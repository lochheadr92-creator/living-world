<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staged fishing rod verification</title></head><body>
<div id="app"><canvas id="world" aria-label="The simulated world"></canvas><div id="ui"></div></div>
<div style="position:fixed;top:60px;left:10px;width:230px;font-size:12px;z-index:2000;background:#15251c;padding:10px;color:white"><strong>STAGED active fishing rods</strong><p>Declared home, six fish, three wood and one stone. Crafting and fishing perform real work.</p><button id="craft">Make a rod</button><button id="fish">Start fishing</button><button id="eat">Finish catch and eat</button><output id="result"></output></div>
<script type="module">
import '/src/styles.css';import {Game} from '/src/app/game.ts';import {Renderer} from '/src/render/renderer.ts';import {mountUI} from '/src/ui/index.ts';import {project} from '/src/render/iso.ts';import {stage,addPerson,building,done,learn} from '/tests/helpers/kit.ts';
import {newActivity,startActivity,stepActivity} from '/src/sim/activities.ts';import {serializeWorld,deserializeWorld} from '/src/app/save.ts';import {conservationReport} from '/src/sim/economy.ts';import {makeSource} from '/src/sim/sources.ts';
const s=stage('visible-rods'),w=s.w;w.settings={...w.settings,dynamics:'rich',rulesVersion:140};const p=addPerson(s,'Ada',40.5,20.5,{hunger:95,thirst:95,energy:95,inv:{wood:3,stone:1}}),home=building(s,'hut',40,18,p.hhId),source=makeSource(w,'fish_spot',44,13,6);done(s);learn(w,p,home,source);
function finish(){for(let i=0;i<1800&&p.activity;i++){w.tick++;stepActivity(w,p);}if(p.activity)throw Error('unfinished');}
const g=new Game(w.settings);g.restoreWorld(w,w.settings);g.setPlaying(false);g.select(p.id);const pt=project(43,16);g.camera={x:pt.sx+15,y:pt.sy,zoom:2.3};const renderer=new Renderer(document.getElementById('world'),g),ui=mountUI(g,document.getElementById('ui')),result=document.getElementById('result');
function verify(){const raw=serializeWorld(w);ui.update(1);result.textContent=` Rod: ${p.inv.rod??0}; source fish: ${source.amount}; carried fish: ${p.inv.fish??0}; consumed fish: ${w.ledger.consumed.fish??0}; hunger: ${Math.round(p.needs.hunger)}; conserved: ${conservationReport(w).ok}; observer pure: ${raw===serializeWorld(w)}; exact save: ${raw===serializeWorld(deserializeWorld(raw))}`;}
document.getElementById('craft').onclick=()=>{startActivity(w,p,newActivity(w,p,{kind:'craft',label:'Make fishing rod',goal:'faster fishing',targetId:home.id,targetType:'building',tx:41,ty:19,spotX:40.5,spotY:20.5,data:{tool:'rod'}}));finish();verify();};
document.getElementById('fish').onclick=()=>{startActivity(w,p,newActivity(w,p,{kind:'gather',label:'Fishing',goal:'a meal',targetId:source.id,targetType:'source',tx:44.5,ty:13.5,spotX:44.5,spotY:14.5,amount:1,data:{stype:'fish_spot',purpose:'work'}}));for(let i=0;i<500&&p.activity?.phase==='travel';i++){w.tick++;stepActivity(w,p);}w.tick++;stepActivity(w,p);verify();};
document.getElementById('eat').onclick=()=>{finish();p.needs.hunger=50;startActivity(w,p,newActivity(w,p,{kind:'eat',label:'Eat the catch',goal:'food',here:true,amount:1}));finish();verify();};
function frame(){renderer.frame(.016);ui.update(.016);requestAnimationFrame(frame);}frame();verify();
</script></body></html>
