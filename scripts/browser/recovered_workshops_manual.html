<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staged mine and mill verification</title></head><body>
<div id="app"><canvas id="world" aria-label="The simulated world"></canvas><div id="ui"></div></div>
<div style="position:fixed;top:60px;left:10px;width:225px;font-size:12px;z-index:2000;background:#15251c;padding:10px;color:white"><strong>STAGED mine and grain mill</strong><p>Declared buildings, nine finite ore, six grain, bakery fuel/water and one pick. Each button performs paid activity.</p><button id="mine">Mine three ore</button><button id="mill">Grind six grain</button><button id="bread">Carry flour and bake</button><output id="result"></output></div>
<script type="module">
import '/src/styles.css';import {Game} from '/src/app/game.ts';import {Renderer} from '/src/render/renderer.ts';import {mountUI} from '/src/ui/index.ts';import {project} from '/src/render/iso.ts';
import {stage,addPerson,building,done,give} from '/tests/helpers/kit.ts';import {newActivity,startActivity,stepActivity} from '/src/sim/activities.ts';import {serializeWorld,deserializeWorld} from '/src/app/save.ts';import {conservationReport} from '/src/sim/economy.ts';import {makeSource} from '/src/sim/sources.ts';import {facilityTick} from '/src/sim/facilities.ts';
const s=stage('visible-workshops'),w=s.w;w.settings={...w.settings,dynamics:'rich',rulesVersion:138};const p=addPerson(s,'Ada',40.5,26.5,{hunger:95,thirst:95,energy:95});const dep=makeSource(w,'ore_vein',43,24,9),mine=building(s,'mine',40,24,p.hhId),mill=building(s,'mill',45,24,p.hhId,{grain:6}),oven=building(s,'bakery',49,24,p.hhId,{water:2,wood:1});mine.ops.depositId=dep.id;give(w,p,'pick');done(s);
function finish(){for(let i=0;i<1800&&p.activity;i++){w.tick++;stepActivity(w,p);for(const b of w.buildings)facilityTick(w,b);}if(p.activity)throw Error('Unfinished action');}
function act(b,kind,data){startActivity(w,p,newActivity(w,p,{kind,label:kind,goal:'paid workshop chain',targetId:b.id,targetType:'building',tx:b.x+b.w/2,ty:b.y+b.h/2,spotX:b.doorX+.5,spotY:b.doorY+.5,amount:1,maxTicks:1800,data}));finish();}
const g=new Game(w.settings);g.restoreWorld(w,w.settings);g.setPlaying(false);g.select(mine.id);const pt=project(46,27);g.camera={x:pt.sx+15,y:pt.sy,zoom:1.7};const renderer=new Renderer(document.getElementById('world'),g),ui=mountUI(g,document.getElementById('ui')),result=document.getElementById('result');
function verify(){const raw=serializeWorld(w);ui.update(1);result.textContent=` Vein ore: ${dep.amount}; mined: ${mine.store.items.ore??0}; mill grain: ${mill.store.items.grain??0}; flour: ${mill.store.items.flour??0}; bread: ${oven.store.items.bread??0}; conserved: ${conservationReport(w).ok}; observer pure: ${raw===serializeWorld(w)}; exact save: ${raw===serializeWorld(deserializeWorld(raw))}`;}
document.getElementById('mine').onclick=()=>{act(mine,'operate',{recipe:'mine_ore',client:p.id});g.select(mine.id);verify();};
document.getElementById('mill').onclick=()=>{act(mill,'operate',{recipe:'mill_flour_separate',client:p.id});g.select(mill.id);verify();};
document.getElementById('bread').onclick=()=>{act(mill,'withdraw',{items:{flour:3}});act(oven,'deposit',{items:{flour:3}});act(oven,'operate',{recipe:'bake_bread',client:p.id});for(let i=0;i<250;i++){w.tick++;facilityTick(w,oven);}g.select(oven.id);verify();};
function frame(){renderer.frame(.016);ui.update(.016);requestAnimationFrame(frame);}frame();verify();
</script></body></html>
