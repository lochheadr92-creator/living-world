<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staged tree planting verification</title></head><body>
<div id="app"><canvas id="world" aria-label="The simulated world"></canvas><div id="ui"></div></div>
<div style="position:fixed;top:60px;left:10px;width:225px;font-size:12px;z-index:2000;background:#15251c;padding:10px;color:white"><strong>STAGED tree planting</strong><p>A real cutting, paid planting and 7,200 isolated source-growth ticks. Initial tree and home are declared.</p><button id="cut">Take living cutting</button><button id="plant">Plant near home</button><button id="grow">Advance ordinary tree growth</button><button id="harvest">Harvest one wood</button><output id="result"></output></div>
<script type="module">
import '/src/styles.css';import {Game} from '/src/app/game.ts';import {Renderer} from '/src/render/renderer.ts';import {mountUI} from '/src/ui/index.ts';import {project} from '/src/render/iso.ts';
import {stage,addPerson,building,site,done,learn} from '/tests/helpers/kit.ts';import {newActivity,startActivity,stepActivity} from '/src/sim/activities.ts';import {generateOptions} from '/src/sim/decision.ts';import {serializeWorld,deserializeWorld} from '/src/app/save.ts';import {conservationReport} from '/src/sim/economy.ts';
import {makeSource,updateSources} from '/src/sim/sources.ts';
const s=stage('visible-forestry'),w=s.w;w.settings={...w.settings,dynamics:'rich',rulesVersion:137};const p=addPerson(s,'Ada',46.5,30.5,{hunger:95,thirst:95,energy:95});const home=building(s,'hut',40,24,p.hhId),b=makeSource(w,'tree',46,29,5);done(s);let young=null;
function finish(){for(let i=0;i<1800&&p.activity;i++){w.tick++;stepActivity(w,p);}if(p.activity)throw Error('Unfinished action');}
const g=new Game(w.settings);g.restoreWorld(w,w.settings);g.setPlaying(false);g.select(b.id);const pt=project(48,28.5);g.camera={x:pt.sx+20,y:pt.sy,zoom:2.5};const renderer=new Renderer(document.getElementById('world'),g),ui=mountUI(g,document.getElementById('ui')),result=document.getElementById('result');
function verify(){const raw=serializeWorld(w);ui.update(1);result.textContent=` Parent wood: ${b.amount}; cuttings: ${p.inv.cutting??0}; planted wood: ${young?.amount??0}; growth: ${Math.round((young?.growth??0)*100)}%; harvested wood: ${p.inv.wood??0}; conserved: ${conservationReport(w).ok}; observer pure: ${raw===serializeWorld(w)}; exact save: ${raw===serializeWorld(deserializeWorld(raw))}`;}
document.getElementById('cut').onclick=()=>{startActivity(w,p,newActivity(w,p,{kind:'tree_work',label:'Take cutting',goal:'plant near home',targetId:b.id,targetType:'source',tx:46.5,ty:29.5,spotX:46.5,spotY:30.5,data:{op:'cut'}}));finish();verify();};
document.getElementById('plant').onclick=()=>{startActivity(w,p,newActivity(w,p,{kind:'tree_work',label:'Plant cutting',goal:'future timber',targetId:home.id,targetType:'building',tx:50.5,ty:28.5,spotX:50.5,spotY:29.5,data:{op:'plant',px:50,py:28}}));finish();young=w.sources.find(t=>t.planted);if(young)g.select(young.id);verify();};
document.getElementById('grow').onclick=()=>{for(let i=0;i<7200;i++){w.tick++;updateSources(w);}verify();};
document.getElementById('harvest').onclick=()=>{if(!young)return;startActivity(w,p,newActivity(w,p,{kind:'gather',label:'Cut planted tree',goal:'use grown timber',targetId:young.id,targetType:'source',tx:50.5,ty:28.5,spotX:50.5,spotY:29.5,amount:1,data:{stype:'tree',purpose:'work'}}));finish();verify();};
function frame(){renderer.frame(.016);ui.update(.016);requestAnimationFrame(frame);}frame();verify();
</script></body></html>
