<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staged brewing verification</title></head><body>
<div id="app"><canvas id="world" aria-label="The simulated world"></canvas><div id="ui"></div></div>
<div style="position:fixed;top:60px;left:10px;width:225px;font-size:12px;z-index:2000;background:#15251c;padding:10px;color:white"><strong>STAGED brewing and shared meal</strong><p>Declared brewery, grain, water, fuel and bread. An invitation is staged after the brew; the meal actions are real.</p><button id="brew">Prepare brew</button><button id="wait">Wait for fermentation</button><button id="meal">Carry beer and share meal</button><output id="result"></output></div>
<script type="module">
import '/src/styles.css';import {Game} from '/src/app/game.ts';import {Renderer} from '/src/render/renderer.ts';import {mountUI} from '/src/ui/index.ts';import {project} from '/src/render/iso.ts';import {leftoverScene} from '/tests/helpers/meal_leftovers.ts';import {building} from '/tests/helpers/kit.ts';
import {newActivity,startActivity,stepActivity} from '/src/sim/activities.ts';import {serializeWorld,deserializeWorld} from '/src/app/save.ts';import {conservationReport,snapshotInitial} from '/src/sim/economy.ts';import {facilityTick} from '/src/sim/facilities.ts';import {generateOptions} from '/src/sim/decision.ts';import {stepWorld} from '/src/sim/world.ts';import {setExternalController} from '/src/sim/external.ts';import {inviteAsk,inviteRespond} from '/src/sim/meals.ts';
const f=leftoverScene(139,false),w=f.w,p=f.host,b=building(f,'brewery',48,42,p.hhId,{grain:6,water:4,wood:1});snapshotInitial(w);w.meals=[];
function act(kind,data){startActivity(w,p,newActivity(w,p,{kind,label:'Brewery work',goal:'shared drink',targetId:b.id,targetType:'building',tx:b.x+1,ty:b.y+1,spotX:b.doorX+.5,spotY:b.doorY+.5,maxTicks:2000,data}));for(let i=0;i<2000&&p.activity;i++){w.tick++;stepActivity(w,p);}if(p.activity)throw Error('unfinished');}
const g=new Game(w.settings);g.restoreWorld(w,w.settings);g.setPlaying(false);g.select(b.id);const pt=project(47,44);g.camera={x:pt.sx+15,y:pt.sy,zoom:1.7};const renderer=new Renderer(document.getElementById('world'),g),ui=mountUI(g,document.getElementById('ui')),result=document.getElementById('result');
function verify(){const raw=serializeWorld(w);ui.update(1);result.textContent=` Brewed: ${w.ledger.created.beer??0}; shared servings: ${w.ledger.consumed.beer??0}; drinkers: ${f.meal.drinkers?.length??0}; carried: ${p.inv.beer??0}; conserved: ${conservationReport(w).ok}; observer pure: ${raw===serializeWorld(w)}; exact save: ${raw===serializeWorld(deserializeWorld(raw))}`;}
document.getElementById('brew').onclick=()=>{act('operate',{recipe:'brew_beer',client:p.id});verify();};
document.getElementById('wait').onclick=()=>{for(let i=0;i<2400;i++){w.tick++;facilityTick(w,b);}verify();};
document.getElementById('meal').onclick=()=>{act('withdraw',{items:{beer:4}});const id=inviteAsk(w,p,f.guest,{mealPlan:{placeId:f.hall.id,placeName:'the communal hall',x:43.5,y:45.4}});inviteRespond(w,p,f.guest,id);f.meal=w.meals.find(m=>m.id===id);const undo=setExternalController({controls:()=>true,choose:()=>({kind:'defer'})});try{for(let i=0;i<440;i++)stepWorld(w);for(const who of [p,f.guest]){who.cooldowns.pause=0;const o=generateOptions(w,who,true,true).options.find(o=>o.kind===(who===p?'host_meal':'attend_meal'));if(!o)throw Error('missing meal option');startActivity(w,who,o.make());}for(let i=0;i<1300&&f.meal.status!=='done';i++)stepWorld(w);}finally{undo();}g.select(p.id);verify();};
function frame(){renderer.frame(.016);ui.update(.016);requestAnimationFrame(frame);}frame();verify();
</script></body></html>
