<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staged shared workshop verification</title></head><body>
<div id="app"><canvas id="world" aria-label="The simulated world"></canvas><div id="ui"></div></div>
<div style="position:fixed;top:60px;left:10px;width:230px;font-size:12px;z-index:2000;background:#15251c;padding:10px;color:white"><strong>STAGED local shared workshop</strong><p>A physically marked mill needs real support. Volunteers then haul eight wood, four planks and four stone and perform the construction work.</p><button id="observe">Ask Ben to support</button><button id="visit">Build with paid materials</button><output id="result"></output></div>
<script type="module">
import '/src/styles.css';import {Game} from '/src/app/game.ts';import {Renderer} from '/src/render/renderer.ts';import {mountUI} from '/src/ui/index.ts';import {project} from '/src/render/iso.ts';import {sharedFixture} from '/tests/helpers/shared_projects.ts';import {civicTalk} from '/tests/helpers/civic.ts';import {stepWorld} from '/src/sim/world.ts';import {setExternalController} from '/src/sim/external.ts';import {projectAt,mayWorkProject} from '/src/sim/townships.ts';import {observe} from '/src/sim/knowledge.ts';import {generateOptions} from '/src/sim/decision.ts';import {startActivity,stepActivity} from '/src/sim/activities.ts';import {serializeWorld,deserializeWorld} from '/src/app/save.ts';import {conservationReport} from '/src/sim/economy.ts';
const f=sharedFixture(true),{w,a:p,b:q,site}=f;const g=new Game(w.settings);g.restoreWorld(w,w.settings);g.setPlaying(false);g.select(p.id);const pt=project(44,43);g.camera={x:pt.sx+15,y:pt.sy,zoom:2.3};const renderer=new Renderer(document.getElementById('world'),g),ui=mountUI(g,document.getElementById('ui')),result=document.getElementById('result');
function verify(){const raw=serializeWorld(w);ui.update(1);const pr=projectAt(w,site.id),made=w.buildings.find(b=>b.id===pr.buildingId);result.textContent=` Project: ${pr.status}; supporters: ${pr.participants.filter(p=>p.status==='supporting').length}; work allowed: ${mayWorkProject(w,p,site.id)}; finished owner: ${made?made.hhId===0?'everyone':made.hhId:'not built'}; conserved: ${conservationReport(w).ok}; observer pure: ${raw===serializeWorld(w)}; exact save: ${raw===serializeWorld(deserializeWorld(raw))}`;}
document.getElementById('observe').onclick=()=>{civicTalk(w,p,q,site.id);verify();};document.getElementById('visit').onclick=()=>{const restore=setExternalController({controls:()=>true,choose:(_w,_p,_ctx,ranked)=>{const o=ranked.find(o=>o.targetId===site.id&&['haul','build'].includes(o.kind))??ranked.find(o=>o.kind==='withdraw');return o?{kind:'pick',key:o.key}:{kind:'fallback',reason:'allow ordinary needs and preparation'};}});try{for(let i=0;i<6000&&projectAt(w,site.id).status==='active';i++)stepWorld(w);}finally{restore();}verify();};function frame(){renderer.frame(.016);ui.update(.016);requestAnimationFrame(frame);}frame();verify();
</script></body></html>
