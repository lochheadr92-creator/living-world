<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Staged project helper verification</title></head>
<body>
  <div id="app"><canvas id="world" aria-label="The simulated world"></canvas><div id="ui"></div></div>
  <script type="module">
    // Verification-only bootstrap; the actual renderer, panel, clock and driver are reused.
    import '/src/styles.css';
    import { Game } from '/src/app/game.ts';
    import { deserializeWorld, serializeWorld } from '/src/app/save.ts';
    import { InhabitDriver, inhabitConfigFromUrl } from '/src/app/inhabit.ts';
    import { Renderer } from '/src/render/renderer.ts';
    import { mountUI } from '/src/ui/index.ts';
    const startPath = new URLSearchParams(location.search).get('start');
    if (!startPath?.startsWith('/inhabitant_evidence/project-helpers-')) throw new Error('Supply the recorded project-helper checkpoint');
    const start = await (await fetch(startPath)).text();
    const world = deserializeWorld(start);
    const game = new Game(world.settings);
    game.restoreWorld(world, world.settings);
    const cfg = inhabitConfigFromUrl('?inhabit=Ada&manual=1&from=0&days=0.5&noarrivals=1', { seed: world.seed });
    const driver = new InhabitDriver(game, cfg);
    const renderer = new Renderer(document.getElementById('world'), game);
    const ui = mountUI(game, document.getElementById('ui'), { inhabit: driver });
    // Export authoritative state only after the manual journey, separately from what
    // the inhabitant can see. This verification-only control never chooses an action.
    const saveEvidence = document.createElement('button');
    saveEvidence.textContent = 'Save verification bundle';
    saveEvidence.style.cssText = 'position:fixed;top:70px;left:45%;z-index:1000';
    saveEvidence.onclick = () => {
      const bundle = { staged: true, start, final: serializeWorld(game.world), transcript: driver.transcriptNow() };
      const url = URL.createObjectURL(new Blob([JSON.stringify(bundle)], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = 'project-helpers-manual-bundle.json';
      a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    };
    document.body.append(saveEvidence);
    await driver.start(); game.setSpeed(16);
    let last = performance.now();
    function frame(now) {
      const dt = (now-last)/1000; last=now;
      game.advance(dt); renderer.frame(Math.min(0.25,dt)); ui.update(Math.min(0.25,dt));
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
