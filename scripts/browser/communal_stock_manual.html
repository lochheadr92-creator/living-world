<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staged communal-stock verification</title></head><body>
<div id="app"><canvas id="world" aria-label="The simulated world"></canvas><div id="ui"></div></div>
<div style="position:fixed;top:60px;left:10px;width:215px;font-size:12px;z-index:2000;background:#15251c;padding:10px;color:white"><strong>STAGED communal stock</strong><p>Staged storehouse and initial wood. A real surplus deposit supplies a second household building a shelter.</p><button id="store">Stack spare wood</button><button id="eat">Use wood for shelter</button><output id="result"></output></div>
<script type="module">
import '/src/styles.css';import {Game} from '/src/app/game.ts';import {Renderer} from '/src/render/renderer.ts';import {mountUI} from '/src/ui/index.ts';import {project} from '/src/render/iso.ts';
import {stage,addPerson,building,site,done,learn} from '/tests/helpers/kit.ts';import {newActivity,startActivity,stepActivity} from '/src/sim/activities.ts';import {generateOptions} from '/src/sim/decision.ts';import {serializeWorld,deserializeWorld} from '/src/app/save.ts';import {conservationReport} from '/src/sim/economy.ts';
const s=stage('visible-stock'),w=s.w;w.settings={...w.settings,dynamics:'rich',rulesVersion:136};const p=addPerson(s,'Ada',40.5,26.5,{hunger:95,thirst:95,energy:95,inv:{wood:8}});const q=addPerson(s,'Ben',40.5,27.5,{hunger:95,thirst:95,energy:95});const b=building(s,'storehouse',40,24,0);done(s);let st=null;
function finish(who=p){for(let i=0;i<1800&&who.activity;i++){w.tick++;stepActivity(w,who);}if(who.activity)throw Error('Unfinished action');}
const g=new Game(w.settings);g.restoreWorld(w,w.settings);g.setPlaying(false);g.select(b.id);const pt=project(43,24.5);g.camera={x:pt.sx+20,y:pt.sy,zoom:2.5};const renderer=new Renderer(document.getElementById('world'),g),ui=mountUI(g,document.getElementById('ui')),result=document.getElementById('result');
function verify(){const raw=serializeWorld(w);ui.update(1);result.textContent=` Communal wood: ${b.store.items.wood??0}; Ada kept: ${p.inv.wood??0}; Ben carried: ${q.inv.wood??0}; shelter used: ${st?.used?.wood??0}; shelter built: ${w.buildings.some(x=>x.type==='lean_to'&&x.hhId===q.hhId)}; conserved: ${conservationReport(w).ok}; observer pure: ${raw===serializeWorld(w)}; exact save: ${raw===serializeWorld(deserializeWorld(raw))}`;}
function chosen(kind){learn(w,p,b);const o=generateOptions(w,p,true,true).options.find(o=>o.kind===kind&&o.targetId===b.id);if(!o)throw Error('No '+kind+' offer');startActivity(w,p,o.make());finish();verify();}
document.getElementById('store').onclick=()=>{const o=generateOptions(w,p,true,true).options.find(o=>o.key===`communal_stock:${b.id}`);if(!o)throw Error('No deposit');startActivity(w,p,o.make());finish();verify();};
document.getElementById('eat').onclick=()=>{st=site(s,'lean_to',45,24,q.hhId,q.id);learn(w,q,b,st);const o=generateOptions(w,q,true,true).options.find(o=>o.kind==='withdraw'&&o.targetId===b.id&&o.yields==='wood');if(!o)throw Error('No collection');startActivity(w,q,o.make());finish(q);startActivity(w,q,newActivity(w,q,{kind:'deposit',label:'Supply shelter',goal:'build a roof',targetId:st.id,targetType:'site',tx:45.5,ty:24.5,spotX:45.5,spotY:25.5,data:{items:{wood:4}}}));finish(q);startActivity(w,q,newActivity(w,q,{kind:'build',label:'Build shelter',goal:'use shared materials',targetId:st.id,targetType:'site',tx:45.5,ty:24.5,spotX:45.5,spotY:25.5,maxTicks:1800}));finish(q);verify();};function frame(){renderer.frame(.016);ui.update(.016);requestAnimationFrame(frame);}frame();verify();
</script></body></html>
