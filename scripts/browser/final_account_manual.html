<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Final account and shore verification</title></head><body>
<div id="app"><canvas id="world" aria-label="The simulated world"></canvas><div id="ui"></div></div>
<div style="position:fixed;top:60px;left:10px;width:230px;font-size:12px;z-index:2000;background:#15251c;padding:10px;color:white"><strong>STAGED final account</strong><p>Declared staged death. The grave shows a historical snapshot, not stored goods. Shore buttons change the camera only.</p><button id="observe">Record staged death</button><button id="visit">Inspect shoreline</button><button id="wide">Wide shoreline view</button><output id="result"></output></div>
<script type="module">
import '/src/styles.css';import {Game} from '/src/app/game.ts';import {Renderer} from '/src/render/renderer.ts';import {mountUI} from '/src/ui/index.ts';import {project} from '/src/render/iso.ts';import {stage,addPerson,done} from '/tests/helpers/kit.ts';import {killPerson} from '/src/sim/lifecycle.ts';import {newActivity} from '/src/sim/activities.ts';import {observe} from '/src/sim/knowledge.ts';import {generateOptions} from '/src/sim/decision.ts';import {startActivity,stepActivity} from '/src/sim/activities.ts';import {serializeWorld,deserializeWorld} from '/src/app/save.ts';import {conservationReport} from '/src/sim/economy.ts';
const s=stage('final-account-view'),w=s.w;w.settings={...w.settings,dynamics:'rich',rulesVersion:144};const p=addPerson(s,'Ada',40,20,{inv:{berries:2}}),q=addPerson(s,'Ben',65,20);done(s);p.activity=newActivity(w,p,{kind:'wander',label:'Walking toward water',goal:'find a drink',tx:42,ty:20});p.log.push({tick:w.tick,text:'The remembered shore was dry.',kind:'need'});const g=new Game(w.settings);g.restoreWorld(w,w.settings);g.setPlaying(false);g.select(p.id);const pt=project(43,20);g.camera={x:pt.sx+15,y:pt.sy,zoom:2.3};const renderer=new Renderer(document.getElementById('world'),g),ui=mountUI(g,document.getElementById('ui')),result=document.getElementById('result');
function verify(){const raw=serializeWorld(w);ui.update(1);result.textContent=` Accounts: ${w.deceased.filter(d=>d.last).length}; Ben death knowledge: ${!!q.relations[p.id]?.deathKnown}; conserved: ${conservationReport(w).ok}; observer pure: ${raw===serializeWorld(w)}; exact save: ${raw===serializeWorld(deserializeWorld(raw))}`;}
document.getElementById('observe').onclick=()=>{killPerson(w,p,'thirst');g.select(w.graves[0].id);verify();};document.getElementById('visit').onclick=()=>{g.select(0);const pt=project(40,13);g.camera={x:pt.sx,y:pt.sy,zoom:2.3};verify();};document.getElementById('wide').onclick=()=>{g.camera={...g.camera,zoom:.5};verify();};function frame(){renderer.frame(.016);ui.update(.016);requestAnimationFrame(frame);}frame();verify();
</script></body></html>
