<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staged grave visit verification</title></head><body>
<div id="app"><canvas id="world" aria-label="The simulated world"></canvas><div id="ui"></div></div>
<div style="position:fixed;top:60px;left:10px;width:230px;font-size:12px;z-index:2000;background:#15251c;padding:10px;color:white"><strong>STAGED local grave visit</strong><p>Ada knows Cora as a parent. Ben is far away and must not learn this remotely.</p><button id="observe">Observe grave</button><button id="visit">Walk and pay respects</button><output id="result"></output></div>
<script type="module">
import '/src/styles.css';import {Game} from '/src/app/game.ts';import {Renderer} from '/src/render/renderer.ts';import {mountUI} from '/src/ui/index.ts';import {project} from '/src/render/iso.ts';import {placesFixture} from '/tests/helpers/personal_places.ts';import {observe} from '/src/sim/knowledge.ts';import {generateOptions} from '/src/sim/decision.ts';import {startActivity,stepActivity} from '/src/sim/activities.ts';import {serializeWorld,deserializeWorld} from '/src/app/save.ts';import {conservationReport} from '/src/sim/economy.ts';
const {w,p,q,g:grave}=placesFixture();const g=new Game(w.settings);g.restoreWorld(w,w.settings);g.setPlaying(false);g.select(p.id);const pt=project(43,20);g.camera={x:pt.sx+15,y:pt.sy,zoom:2.3};const renderer=new Renderer(document.getElementById('world'),g),ui=mountUI(g,document.getElementById('ui')),result=document.getElementById('result');
function verify(){const raw=serializeWorld(w);ui.update(1);result.textContent=` Ada memories: ${p.placeMemories?.length??0}; Ben memories: ${q.placeMemories?.length??0}; visited: ${p.placeMemories?.[0]?.visited!==undefined}; conserved: ${conservationReport(w).ok}; observer pure: ${raw===serializeWorld(w)}; exact save: ${raw===serializeWorld(deserializeWorld(raw))}`;}
document.getElementById('observe').onclick=()=>{observe(w,p,grave);verify();};document.getElementById('visit').onclick=()=>{const option=generateOptions(w,p,true,true).options.find(o=>o.kind==='pay_respects');if(!option)throw Error('no visit option');startActivity(w,p,option.make());for(let i=0;i<400&&p.activity;i++){w.tick++;stepActivity(w,p);}verify();};function frame(){renderer.frame(.016);ui.update(.016);requestAnimationFrame(frame);}frame();verify();
</script></body></html>
