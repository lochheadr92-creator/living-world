<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staged sheep verification</title></head><body>
<div id="app"><canvas id="world" aria-label="The simulated world"></canvas><div id="ui"></div></div>
<div style="position:fixed;top:70px;left:10px;width:225px;z-index:2000;background:#15251c;padding:10px;color:white"><strong>STAGED sheep contract</strong><p>One unowned sheep, finite carried supplies and two initial wool at the yard.</p><button id="care">Acquire, feed and shear</button><button id="cloth">Weave and wear wool</button><button id="neglect">Leave without food or water</button><output id="result"></output></div>
<script type="module">
import '/src/styles.css';
import {Game} from '/src/app/game.ts';import {Renderer} from '/src/render/renderer.ts';import {mountUI} from '/src/ui/index.ts';import {project} from '/src/render/iso.ts';
import {stage,addPerson,done,learn,building} from '/tests/helpers/kit.ts';import {makeSheep,updateSheep} from '/src/sim/livestock.ts';import {clothingWarmth} from '/src/sim/clothing.ts';
import {generateOptions} from '/src/sim/decision.ts';import {startActivity,stepActivity} from '/src/sim/activities.ts';import {serializeWorld,deserializeWorld} from '/src/app/save.ts';import {conservationReport,transfer} from '/src/sim/economy.ts';
const s=stage('sheep-rendered'),w=s.w;w.settings={...w.settings,dynamics:'rich',rulesVersion:129};w.weather.temp=10;
const p=addPerson(s,'Ada',40.5,40.5,{hunger:90,thirst:90,energy:90,inv:{wood:2,fibre:1,grain:3,water:2}}),a=makeSheep(w,42,40.5,'f'),yard=building(s,'timber_yard',40,43,p.hhId,{wool:2});done(s);learn(w,p,a,yard);
const g=new Game(w.settings);g.restoreWorld(w,w.settings);g.setPlaying(false);g.select(a.id);const pt=project(41,41);g.camera={x:pt.sx+20,y:pt.sy,zoom:2};
const renderer=new Renderer(document.getElementById('world'),g),ui=mountUI(g,document.getElementById('ui')),result=document.getElementById('result');let summary='Initial animal has no food, water or wool.';
function run(key){learn(w,p,a,yard);const o=generateOptions(w,p,true,true).options.find(o=>o.key===key);if(!o)throw Error('No offered action '+key);startActivity(w,p,o.make());for(let n=0;n<1200&&p.activity;n++){w.tick++;stepActivity(w,p);}if(p.activity)throw Error('unfinished '+key);}
function verify(){const before=serializeWorld(w);ui.update(1);result.textContent=summary+` Wool created: ${w.ledger.created.wool??0}; wool used: ${w.ledger.consumed.wool??0}; clothing warmth: ${clothingWarmth(w,p)}; conservation: ${conservationReport(w).ok}; pure: ${before===serializeWorld(w)}; exact save: ${before===serializeWorld(deserializeWorld(before))}`;}
document.getElementById('care').onclick=()=>{run(`sheep:acquire:${a.id}`);run(`sheep:feed:${a.id}`);run(`sheep:water:${a.id}`);run(`sheep:water:${a.id}`);for(let n=0;n<4800;n++){w.tick++;updateSheep(w,a);}run(`sheep:shear:${a.id}`);summary='Paid tether, two grain and two water grew one collected wool.';g.select(a.id);verify();document.getElementById('care').disabled=true;};
document.getElementById('cloth').onclick=()=>{p.needs.warmth=95;w.weather.temp=22;learn(w,p,yard);const deposit=generateOptions(w,p,true,true).options.find(o=>o.kind==='deposit'&&o.targetId===yard.id&&o.make?.()?.data.items?.wool);if(!deposit)throw Error('No wool delivery offered');run(deposit.key);run(`operate:${yard.id}:weave_wool_garment`);learn(w,p,yard);const take=generateOptions(w,p,true,true).options.find(o=>o.kind==='withdraw'&&o.make?.()?.data.items?.garment);if(!take)throw Error('No wool garment collection');run(take.key);const garment=w.tools.find(t=>t.holder===p.id&&t.kind==='garment');run(`dress:${garment.id}`);summary='One grown fleece and two staged wool became an owned worn garment through paid weaving during a warm working period.';g.select(p.id);verify();document.getElementById('cloth').disabled=true;};
document.getElementById('neglect').onclick=()=>{for(let n=0;n<9000&&w.byId.has(a.id);n++){w.tick++;updateSheep(w,a);}const body=w.piles.find(b=>b.carcass?.animalId===a.id);summary=`Neglect removed living sheep: ${!w.byId.has(a.id)}; edible meat left: ${body?.carcass.remaining.meat??0}; body meat lost: ${body?.carcass.lost.meat??0}.`;if(body)g.select(body.id);verify();document.getElementById('neglect').disabled=true;};
function frame(){renderer.frame(.016);ui.update(.016);requestAnimationFrame(frame);}frame();verify();
</script></body></html>
