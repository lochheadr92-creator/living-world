<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staged paid nourishment verification</title></head><body>
<div id="app"><canvas id="world" aria-label="The simulated world"></canvas><div id="ui"></div></div>
<div style="position:fixed;top:60px;left:10px;width:215px;font-size:12px;z-index:2000;background:#15251c;padding:10px;color:white"><strong>STAGED paid nourishment contract</strong><p>One real berry. Reference conditions hold water, energy and temperature comfortable. Buttons execute eating, paid recovery, then a food-free shortage.</p><button id="eat">Eat the only berry and rest</button><button id="shortage">Continue with no food</button><output id="result"></output></div>
<script type="module">
import '/src/styles.css';
import {Game} from '/src/app/game.ts';import {Renderer} from '/src/render/renderer.ts';import {mountUI} from '/src/ui/index.ts';import {project} from '/src/render/iso.ts';
import {stage,addPerson,done} from '/tests/helpers/kit.ts';import {startActivity,stepActivity,newActivity} from '/src/sim/activities.ts';import {updateNeeds} from '/src/sim/needs.ts';
import {serializeWorld,deserializeWorld} from '/src/app/save.ts';import {conservationReport} from '/src/sim/economy.ts';import {CURRENT_RULES_VERSION} from '/src/sim/rulesversion.ts';
const s=stage('paid-nourishment'),w=s.w;w.settings={...w.settings,dynamics:'rich',rulesVersion:CURRENT_RULES_VERSION};const p=addPerson(s,'Ada',40.5,40.5,{age:28,hunger:50,thirst:90,energy:50,inv:{berries:1}});done(s);p.health=50;p.pose='sleep';p.needs.warmth=90;w.weather.temp=20;w.weather.rain=0;
const g=new Game(w.settings);g.restoreWorld(w,w.settings);g.setPlaying(false);g.select(p.id);const pt=project(40,40);g.camera={x:pt.sx+20,y:pt.sy,zoom:2};
const renderer=new Renderer(document.getElementById('world'),g),ui=mountUI(g,document.getElementById('ui')),result=document.getElementById('result');
function verify(label){const before=serializeWorld(w);ui.update(1);result.textContent=` ${label}; berries eaten: ${w.ledger.consumed.berries??0}; health: ${p.health.toFixed(3)}; stored: ${(p.nourishment??0).toFixed(3)}; conservation: ${conservationReport(w).ok}; pure: ${before===serializeWorld(w)}; exact save: ${before===serializeWorld(deserializeWorld(before))}`;}
document.getElementById('eat').onclick=()=>{if((p.inv.berries??0)<1)return;startActivity(w,p,newActivity(w,p,{kind:'eat',label:'Eat the only berry',goal:'eat',here:true,data:{limit:{portions:1}}}));for(let n=0;n<100&&p.activity;n++){w.tick++;stepActivity(w,p);}p.pose='sleep';for(let n=0;n<60;n++){w.tick++;updateNeeds(w,p);}verify('Paid recovery');};
document.getElementById('shortage').onclick=()=>{p.pose='stand';for(let n=0;n<4000;n++){p.needs.thirst=90;p.needs.energy=90;p.needs.warmth=90;w.tick++;updateNeeds(w,p);}verify('Food exhausted; reserves depleted; health falling');};
function frame(){renderer.frame(.016);ui.update(.016);requestAnimationFrame(frame);}frame();verify('No paid intake yet');
</script></body></html>
