<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staged skill coaching verification</title></head><body>
<div id="app"><canvas id="world" aria-label="The simulated world"></canvas><div id="ui"></div></div>
<div style="position:fixed;top:60px;left:10px;width:230px;font-size:12px;z-index:2000;background:#15251c;padding:10px;color:white"><strong>STAGED local skill coaching</strong><p>Ada asks Ben for woodcutting instruction. Both must spend 180 ticks together.</p><button id="observe">Ask for coaching</button><button id="visit">Complete 180 ticks</button><output id="result"></output></div>
<script type="module">
import '/src/styles.css';import {Game} from '/src/app/game.ts';import {Renderer} from '/src/render/renderer.ts';import {mountUI} from '/src/ui/index.ts';import {project} from '/src/render/iso.ts';import {coachingFixture,startCoaching,coachingTick} from '/tests/helpers/skill_coaching.ts';import {observe} from '/src/sim/knowledge.ts';import {generateOptions} from '/src/sim/decision.ts';import {startActivity,stepActivity} from '/src/sim/activities.ts';import {serializeWorld,deserializeWorld} from '/src/app/save.ts';import {conservationReport} from '/src/sim/economy.ts';
const f=coachingFixture(),{w,p,q}=f;const g=new Game(w.settings);g.restoreWorld(w,w.settings);g.setPlaying(false);g.select(p.id);const pt=project(41,40);g.camera={x:pt.sx+15,y:pt.sy,zoom:2.3};const renderer=new Renderer(document.getElementById('world'),g),ui=mountUI(g,document.getElementById('ui')),result=document.getElementById('result');
function verify(){const raw=serializeWorld(w);ui.update(1);result.textContent=` Ada wood skill: ${p.skills.wood.toFixed(3)}; lessons: ${p.skillExperience?.length??0}; conserved: ${conservationReport(w).ok}; observer pure: ${raw===serializeWorld(w)}; exact save: ${raw===serializeWorld(deserializeWorld(raw))}`;}
document.getElementById('observe').onclick=()=>{startCoaching(f);verify();};document.getElementById('visit').onclick=()=>{for(let i=0;i<220;i++)coachingTick(f);verify();};function frame(){renderer.frame(.016);ui.update(.016);requestAnimationFrame(frame);}frame();verify();
</script></body></html>
